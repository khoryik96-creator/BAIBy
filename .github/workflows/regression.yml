name: Regression checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  legacy:
    name: Legacy prototype checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/legacy.test.mjs

  simulation:
    name: C# simulation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/Simulation/SimulationChecks.csproj --configuration Release
