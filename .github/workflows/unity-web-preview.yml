name: Build Unity Web preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Export browser playtest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo "::error::Configure GameCI Unity activation secrets before running this workflow."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Make room for Unity Web tooling
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h .

      - name: Export Unity Web build
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: BAIby.Editor.BuildPreview.BuildWeb
          versioning: None

      - name: Check preview files and serving
        run: python3 tools/check-web-build.py build/Web

      - name: Upload browser preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baiby-web
          path: build/Web/
          if-no-files-found: error
          retention-days: 14
